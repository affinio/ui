name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / type-check
        run: pnpm run lint && pnpm -r --if-present type-check

      - name: Build packages
        run: pnpm -r --if-present build
      - name: Check component ESM artifacts
        run: pnpm run quality:components:esm
      - name: Run component benchmark evidence
        run: pnpm run bench:components:ci

  test-matrix:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - visual
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: matrix.suite == 'visual'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit matrix suite
        if: matrix.suite == 'unit'
        run: pnpm run test:unit
      - name: Run visual matrix suite
        if: matrix.suite == 'visual'
        run: pnpm run test:matrix:visual
      - name: Build component demo
        if: matrix.suite == 'visual'
        run: pnpm --filter demo-vue build
      - name: Run component browser smoke
        if: matrix.suite == 'visual'
        env:
          TREEVIEW_SMOKE_SCREENSHOTS: "0"
        run: pnpm run smoke:treeview:demo
      - name: Run dialog and diagram browser smoke
        if: matrix.suite == 'visual'
        run: pnpm run smoke:components:demo
